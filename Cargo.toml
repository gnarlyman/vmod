[package]
name = "vmod"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.10.0", features = ["v4_10"] }
gio = "0.21"
glib = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
walkdir = "2.5.0"
anyhow = "1.0"
open = "5"
io_unity = "0.3"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
url = "2.5"
log = "0.4"
fern = "0.7"

[dev-dependencies]
tempfile = "3.8"

[build-dependencies]
glib-build-tools = "0.21"
